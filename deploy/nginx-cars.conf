# nginx: поддомен cars.ВАШ-ДОМЕН → Node на 127.0.0.1:3010
# Скопировать в /etc/nginx/sites-available/cars.ВАШ-ДОМЕН, заменить ВАШ-ДОМЕН,
# включить симлинком в sites-enabled, затем: sudo nginx -t && sudo systemctl reload nginx
# HTTPS (блок listen 443) certbot допишет сам: sudo certbot --nginx -d cars.ВАШ-ДОМЕН

server {
    listen 80;
    listen [::]:80;
    server_name cars.ВАШ-ДОМЕН;

    # фото товаров приходят в base64, с запасом
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
